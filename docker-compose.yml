# NewAPI Middleware Tool - Docker Compose Configuration
#
# 使用方式:
#   1. 通过 install.sh 一键安装 (推荐)
#   2. 通过 deploy.sh 自动部署: ./deploy.sh
#   3. 手动部署: 复制 .env.example 为 .env 并配置后运行 docker-compose up -d
#
# 更新方式:
#   a) 面板"设置"页一键更新：在 .env 配置 WATCHTOWER_HTTP_API_TOKEN，
#      然后以 updater profile 启动：docker compose --profile updater up -d
#   b) 手动: docker compose pull && docker compose up -d
#      （手动回滚：把 image 换成上一个 commit 的 sha tag 后 up -d）

services:
  newapi-tools:
    image: ghcr.io/chinatoyhunter/new_api_tools:latest
    container_name: newapi-tools
    labels:
      # 只允许本项目的 scoped Watchtower 更新此容器；宿主机其他容器不会进入其扫描范围。
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-newapi-tools}"
    ports:
      # FRONTEND_BIND 控制端口绑定的网卡：
      #   - 0.0.0.0（默认）：所有网卡可达，浏览器可直连 IP:1145
      #   - 127.0.0.1     ：仅本机，需要在宿主机配 nginx 反代到 https://your-domain
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-1145}:80"
    environment:
      # 数据库配置 (Go 版本统一使用 SQL_DSN)
      - SQL_DSN=${SQL_DSN:-}
      # 日志专用库（可选）：NewAPI 若用 LOG_SQL_DSN 把 logs 表分离到独立库，
      # 本工具需读取该库才能看到实时日志/流量。为空时日志查询回落到主库。
      - LOG_SQL_DSN=${LOG_SQL_DSN:-}
      # 兼容旧版本分离配置
      - DB_ENGINE=${DB_ENGINE:-}
      - DB_DNS=${DB_DNS:-}
      - DB_PORT=${DB_PORT:-}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # 连接池（可选）
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-}
      # 认证
      - API_KEY=${API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      # Redis 缓存
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # 服务配置
      # SERVER_HOST 默认 127.0.0.1（仅供容器内 Nginx 反代访问，对外端口由 Nginx 暴露）
      # 如需让其他容器/宿主机直连 Go 后端 8000，可在 .env 中改为 0.0.0.0（不推荐，安全风险）
      - SERVER_HOST=${SERVER_HOST:-127.0.0.1}
      - SERVER_PORT=8000
      - TIMEZONE=${TIMEZONE:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # NewAPI 连接
      - NEWAPI_BASEURL=${NEWAPI_BASEURL:-}
      # 一键更新（watchtower sidecar，可选；不配 TOKEN 则设置页显示部署指引）
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
      - WATCHTOWER_API_URL=${WATCHTOWER_API_URL:-http://watchtower:8080}
      - WATCHTOWER_IMAGE=${WATCHTOWER_IMAGE:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # 用于 NewAPI 以 network_mode: host 部署的场景：DSN 中的 127.0.0.1
    # 会被 deploy.sh 改写为 host.docker.internal，靠这条解析到宿主机网关。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - newapi-network

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: newapi-tools-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # 一键更新 sidecar（可选）：唯一持有 docker.sock 的服务。
  # 默认关闭周期轮询，只暴露 HTTP API
  # 供后端在"设置"页触发：POST /v1/check（查 digest）、POST /v1/update（拉新镜像重建容器）。
  # 启用方式：在 .env 设置 WATCHTOWER_HTTP_API_TOKEN 后
  # `docker compose --profile updater up -d`；无 profile 时 sidecar 不启动。
  watchtower:
    # 固定 release tag + digest（发布版 1.21.2 == latest，已在 GHCR 验证）。
    # 注意：该 fork 只发布在 GHCR 的 nicholas-fedor/watchtower（无 v 前缀 tag）。
    image: ghcr.io/nicholas-fedor/watchtower:1.21.2@sha256:3b8d2e3f0f6ff9295a5d634e4fdb7062e5e6602f71d89baa15cd4d39d22b5743
    container_name: newapi-tools-watchtower
    profiles: ["updater"]
    labels:
      # scoped Watchtower 实例自身也必须带相同 scope，避免与宿主机其他实例冲突。
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-newapi-tools}"
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
      # 只启用 HTTP API 端点；禁用定时轮询（由设置页手动触发）。
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_HTTP_API_ENDPOINTS=update,check
      - WATCHTOWER_HTTP_API_CHECK_TIMEOUT=5m
      - WATCHTOWER_HTTP_API_UPDATE_TIMEOUT=5m
      # scope + enable 标签双重收口：仅扫描上方 newapi-tools 容器。
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=${WATCHTOWER_SCOPE:-newapi-tools}
      - TZ=${TIMEZONE:-Asia/Shanghai}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  default:
  newapi-network:
    external: true
    name: ${NEWAPI_NETWORK:-new-api_default}

volumes:
  redis_data:
